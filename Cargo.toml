[package]
name = "ngal-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31"
egui = "0.31"
image = { version = "0.25", features = ["png", "jpeg", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[profile.release]
lto = true
opt-level = "z"
strip = true
codegen-units = 1
panic = "abort"