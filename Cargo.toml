[package]
name = "ngal-gui"
version = "0.1.0"
edition = "2021"
description = "一个用 Rust 编写的galgame引擎，ngal引擎的egui版本"
readme = "README.md"
homepage = "https://nasyt.hoha.top"
repository = "https://github.com/nasyt233/ngal"
license = "MIT OR Apache-2.0"
authors = ["nasyt"]
keywords = ["ngal", "nasyt", "galgame", "game", "game-engines"]

[dependencies]
eframe = "0.31"
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[profile.release]
lto = true
opt-level = "z"
strip = true
codegen-units = 1
panic = "abort"